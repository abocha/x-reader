[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "x-reader"
version = "0.3.0"
description = "Read-only X/Twitter reader with stdio MCP tools for the x-reader plugin."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mcp", "twitter", "x", "llm-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp==2.3.0",
  "twscrape[curl]==0.20.1",
]

[project.urls]
Repository = "https://github.com/abocha/x-reader"
Issues = "https://github.com/abocha/x-reader/issues"

[project.scripts]
x-reader-mcp = "x_reader.mcp_server:main"
x-reader-verify = "x_reader.verify:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.16.9",
  "ty>=0.0.84",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
