name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-lock
          path: uv.lock
